[profile.default]
solc = '0.8.28'
src = 'src'
libs = ['lib']
fallback_oz = true
is_system = false # Note: NonceHolder and the ContractDeployer system contracts can only be called with a special isSystem flag as true
mode = "3"
remappings = [
    '@rari-capital/solmate/=lib/solmate/',
    'ds-test/=lib/ds-test/src/',
    'forge-std/=lib/forge-std/src/',
    'murky/=lib/murky/src/',
    '@openzeppelin/=lib/openzeppelin-contracts/',
    'solarray/=lib/solarray/src/',
    'solady/=lib/solady/',
    'seaport-sol/=lib/seaport-sol/',
    'seaport-types/=lib/seaport-types/',
    'seaport-core/=lib/seaport-core/',
    'seaport/=contracts/',
    'closedsea/=lib/closedsea/',
    'erc721a/=lib/closedsea/lib/erc721a'
]

[profile.validator]
solc = '0.8.17'
src = 'contracts/helpers/order-validator'
optimizer_runs = 1

[fuzz]
runs = 1_000
max_test_rejects = 1_000_000

[profile.reference]
solc = '0.8.24'
src = 'reference'
via_ir = false
out = 'reference-out'
script = 'reference'
test = 'test/foundry'
cache_path = 'reference-cache'


[profile.optimized]
via_ir = true
out = 'optimized-out'
script = 'contracts'
bytecode_hash = 'none'
# no need to compile tests with via-ir since they load optimized bytecode directly by default
test ='contracts'

[profile.test]
src = 'test/foundry'

[profile.test.fuzz]
runs = 1_000

[profile.lite]
out = 'optimized-out'

[profile.debug]
src = 'contracts'
optimizer = false

[profile.moat_debug]
optimizer = false
test = 'test/foundry/new'

[profile.offerers]
test='test/foundry/offerers'

[fmt]
line_length = 80
tab_width = 4
bracket_spacing = true

# See more config options https://github.com/gakonst/foundry/tree/master/config
[rpc_endpoints]
blastTest = "https://sepolia.blast.io"
blastMain = "https://rpc.blast.io"
baseTest = "https://sepolia.base.org"
baseMain = "https://mainnet.base.org"
ethTest = "https://rpc.sepolia.org"
ethMain = "https://eth-mainnet.public.blastapi.io"
flowMain = "https://mainnet.evm.nodes.onflow.org"
apeMain = "https://apechain.calderachain.xyz/http"
abstractTest = "https://api.testnet.abs.xyz"
abstractMain = "https://api.mainnet.abs.xyz"
sophon = "${SOPHON_RPC_URL}"

[etherscan]
blast_sepolia = { key = "${BLAST_API_KEY}" }
blast = { key = "${BLAST_API_KEY}" }
base_sepolia = { key = "${BASE_API_KEY}" }
base = { key = "${BASE_API_KEY}" }
sepolia = { key = "${ETHEREUM_API_KEY}" }
mainnet = { key = "${ETHEREUM_API_KEY}" }
flow = { url = "https://evm.flowscan.io" , chain = 747, key = "${BASE_API_KEY}" }
apechain = { url = "https://api.apescan.io/api", chain = 33139 , key = "${APE_API_KEY}" }
abstract = { url = "https://api.abscan.org/api", chain = 2741, key = ''}
abstract_sepolia = { url = "https://api-sepolia.abscan.org/api", chain = 11124, key = ''}
sophon = { key = "${ETHERSCAN_API_KEY}", url = "${SOPHON_VERIFIER_URL}", chain = 50104 }
